<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chi tiết sản phẩm</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="container nav">

        <a href="index.html" class="logo">
            INDUSTRIAL PARTS
        </a>


        <nav>

            <a href="index.html">
                Trang chủ
            </a>

            <a href="index.html#products">
                Sản phẩm
            </a>

            <a href="index.html#about">
                Giới thiệu
            </a>

            <a href="index.html#contact">
                Liên hệ
            </a>

        </nav>


        <div class="actions">

            <select id="lang">

                <option>VI</option>
                <option>EN</option>
                <option>中</option>

            </select>

        </div>

    </div>

</header>


<main class="container section">

    <a href="index.html#products">
        ← Quay lại sản phẩm
    </a>


    <div id="detail"></div>

</main>


<a
    class="zalo"
    href="https://zalo.me/SDT-CUA-ANH"
    target="_blank"
>
    Zalo
</a>


<script src="script.js"></script>


<script>

const code =
    new URLSearchParams(location.search).get("code");


const product =
    products.find(p => p.code === code) || products[0];


document.querySelector("#detail").innerHTML = `

<div class="detail">

    <img
        src="${product.image}"
        onerror="this.src='images/placeholder.svg'"
        alt="${product.name}"
    >


    <div>

        <span class="eyebrow">
            ${product.category}
        </span>


        <h1>
            ${product.name}
        </h1>


        <p>
            <b>Mã sản phẩm:</b>
            ${product.code}
        </p>


        <p>
            <b>Quy cách:</b>
            ${product.spec}
        </p>


        <p>
            ${product.desc}
        </p>


        <a
            class="btn"
            href="https://zalo.me/SDT-CUA-ANH"
            target="_blank"
        >
            Liên hệ Zalo
        </a>

    </div>

</div>

`;

</script>


</body>
</html>
